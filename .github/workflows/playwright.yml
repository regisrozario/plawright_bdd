name: Playwright Tests
# Manual trigger only: the suite hits live apple.com (read-only), so it must not
# run automatically on every push/PR. CI runs headless, which Apple's bot
# detection is more likely to block; expect occasional 403s/challenge pages.
on:
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx bddgen
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
